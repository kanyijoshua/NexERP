<app-company-switcher></app-company-switcher>

<erp-page-toolbar
  title="Erp::Menu:ColumnLayouts"
  breadcrumb="Erp::Menu:Reports"
  icon="fas fa-columns"
  [showSearch]="false"
  permission="Erp.AccountSchedules.Manage"
  (create)="openCreate()"
></erp-page-toolbar>

<erp-table
  tableId="column-layouts"
  [items]="data.items"
  [columns]="columns"
  [actionsWidth]="140"
  [clickableRows]="false"
>
  <ng-template erpTableCol="name" let-row="row">
    <a
      class="fw-bold text-primary font-monospace text-decoration-none erp-record-link"
      role="button"
      (click)="openEdit(row)"
    >
      {{ row.name }}
    </a>
  </ng-template>
  <ng-template erpTableCol="lineCount" let-value="value">
    <span class="font-monospace fw-semibold">{{ value || 0 }}</span>
  </ng-template>
  <ng-template erpTableActions let-row="row">
    <div class="d-inline-flex align-items-center gap-1 justify-content-end">
      <button
        type="button"
        class="btn btn-sm btn-outline-secondary erp-action-btn"
        [title]="'Erp::Lines' | abpLocalization"
        (click)="openLines(row)"
      >
        <i class="fas fa-list-ol"></i>
      </button>
      <button
        *abpPermission="'Erp.AccountSchedules.Manage'"
        type="button"
        class="btn btn-sm btn-outline-primary erp-action-btn"
        [title]="'Erp::Edit' | abpLocalization"
        (click)="openEdit(row)"
      >
        <i class="fas fa-pen"></i>
      </button>
      <button
        *abpPermission="'Erp.AccountSchedules.Manage'"
        type="button"
        class="btn btn-sm btn-outline-danger erp-action-btn"
        [title]="'Erp::Delete' | abpLocalization"
        (click)="remove(row)"
      >
        <i class="fas fa-trash"></i>
      </button>
    </div>
  </ng-template>
</erp-table>

<abp-modal [(visible)]="isModalOpen" [busy]="isBusy">
  <ng-template #abpHeader>
    <h5 class="modal-title">{{ (selected ? 'Erp::Edit' : 'Erp::New') | abpLocalization }}</h5>
  </ng-template>

  <ng-template #abpBody>
    <form *ngIf="form" [formGroup]="form" (ngSubmit)="save()" validateOnSubmit>
      <div class="row g-3">
        <div class="col-md-5">
          <label class="form-label" for="cl-name">{{ 'Erp::Code' | abpLocalization }} *</label>
          <input id="cl-name" type="text" class="form-control" formControlName="name" autofocus />
        </div>
        <div class="col-md-7">
          <label class="form-label" for="cl-description">{{
            'Erp::Description' | abpLocalization
          }}</label>
          <input
            id="cl-description"
            type="text"
            class="form-control"
            formControlName="description"
          />
        </div>
      </div>
    </form>
  </ng-template>

  <ng-template #abpFooter>
    <button type="button" class="btn btn-outline-secondary" abpClose>
      {{ 'AbpUi::Cancel' | abpLocalization }}
    </button>
    <abp-button iconClass="fa fa-check" [disabled]="form?.invalid" (click)="save()">
      {{ 'Erp::Save' | abpLocalization }}
    </abp-button>
  </ng-template>
</abp-modal>

<abp-modal [(visible)]="isLinesModalOpen" [busy]="isBusy" [options]="{ size: 'xl' }">
  <ng-template #abpHeader>
    <h5 class="modal-title">
      {{ 'Erp::ColumnLayout' | abpLocalization }}
      <span class="text-muted">· {{ layoutOwner?.name }}</span>
    </h5>
  </ng-template>

  <ng-template #abpBody>
    <p class="form-text mt-0">{{ 'Erp::ComparisonDateFormulaHint' | abpLocalization }}</p>
    <erp-line-grid
      [lines]="layoutLines"
      [columns]="lineColumns"
      (addLine)="addLine()"
      (removeLine)="removeLine($event)"
    ></erp-line-grid>
  </ng-template>

  <ng-template #abpFooter>
    <button type="button" class="btn btn-outline-secondary" abpClose>
      {{ 'AbpUi::Cancel' | abpLocalization }}
    </button>
    <abp-button iconClass="fa fa-check" [disabled]="layoutLines.invalid" (click)="saveLines()">
      {{ 'Erp::Save' | abpLocalization }}
    </abp-button>
  </ng-template>
</abp-modal>
