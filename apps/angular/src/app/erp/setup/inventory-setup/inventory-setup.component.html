<erp-page-toolbar
  title="Erp::InventorySetup"
  breadcrumb="Erp::Menu:Setup"
  icon="fas fa-boxes-stacked"
  [showSearch]="false"
  [showCreate]="false"
></erp-page-toolbar>

<p class="text-muted">{{ 'Erp::InventorySetupHelp' | abpLocalization }}</p>

<form [formGroup]="form" (ngSubmit)="save()">
  <div class="row g-4">
    <div class="col-lg-6">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-header bg-white fw-bold">
          <i class="fas fa-sliders text-primary me-2"></i>{{ 'Erp::General' | abpLocalization }}
        </div>
        <div class="card-body">
          <div class="form-check form-switch mb-3">
            <input id="inv-cost" class="form-check-input" type="checkbox" role="switch" formControlName="automaticCostPosting" />
            <label class="form-check-label" for="inv-cost">{{ 'Erp::AutomaticCostPosting' | abpLocalization }}</label>
            <div class="form-text">{{ 'Erp::AutomaticCostPostingHelp' | abpLocalization }}</div>
          </div>
          <div class="form-check form-switch mb-3">
            <input id="inv-negative" class="form-check-input" type="checkbox" role="switch" formControlName="preventNegativeInventory" />
            <label class="form-check-label" for="inv-negative">{{ 'Erp::PreventNegativeInventory' | abpLocalization }}</label>
          </div>
          <div class="form-check form-switch">
            <input id="inv-location" class="form-check-input" type="checkbox" role="switch" formControlName="locationMandatory" />
            <label class="form-check-label" for="inv-location">{{ 'Erp::LocationMandatory' | abpLocalization }}</label>
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-6">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-header bg-white fw-bold">
          <i class="fas fa-hashtag text-primary me-2"></i>{{ 'Erp::Numbering' | abpLocalization }}
        </div>
        <div class="card-body">
          <div class="row align-items-center">
            <label class="col-sm-5 col-form-label" for="inv-item-nos">{{ 'Erp::ItemNos' | abpLocalization }}</label>
            <div class="col-sm-7">
              <select id="inv-item-nos" class="form-select form-select-sm" formControlName="itemNos">
                <option [ngValue]="null">{{ 'Erp::NumberedByHand' | abpLocalization }}</option>
                @for (s of series(); track s.id) {
                  <option [ngValue]="s.code">{{ s.code }} — {{ s.description }}</option>
                }
              </select>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div *abpPermission="'Erp.InventorySetup.Update'" class="text-end mt-3">
    <abp-button buttonType="submit" iconClass="fa fa-check" [loading]="saving()" [disabled]="form.pristine || loading()">
      {{ 'Erp::Save' | abpLocalization }}
    </abp-button>
  </div>
</form>
