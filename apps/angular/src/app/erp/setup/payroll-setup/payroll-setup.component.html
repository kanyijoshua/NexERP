<erp-page-toolbar
  title="Erp::PayrollSetup"
  breadcrumb="Erp::Menu:Payroll"
  icon="fas fa-money-check-dollar"
  [showSearch]="false"
  [showCreate]="false"
></erp-page-toolbar>

<p class="text-muted">{{ 'Erp::PayrollSetupHelp' | abpLocalization }}</p>

<form [formGroup]="form" (ngSubmit)="save()">
  <div class="card border-0 shadow-sm" style="max-width: 760px">
    <div class="card-header bg-light fw-semibold">{{ 'Erp::General' | abpLocalization }}</div>
    <div class="card-body">
      <div class="row align-items-center mb-2">
        <label class="col-sm-5 col-form-label" for="ps-run-nos">{{ 'Erp::PayrollRunNos' | abpLocalization }}</label>
        <div class="col-sm-7">
          <select id="ps-run-nos" class="form-select form-select-sm" formControlName="payrollRunNos">
            <option [ngValue]="null">{{ 'Erp::NumberedByHand' | abpLocalization }}</option>
            @for (s of series(); track s.id) {
              <option [ngValue]="s.code">{{ s.code }} — {{ s.description }}</option>
            }
          </select>
        </div>
      </div>
      <div class="row align-items-center mb-2">
        <label class="col-sm-5 col-form-label" for="ps-relief">{{ 'Erp::PersonalRelief' | abpLocalization }}</label>
        <div class="col-sm-7">
          <input id="ps-relief" type="number" min="0" step="0.01" class="form-control form-control-sm" formControlName="personalRelief" />
          <div class="form-text">{{ 'Erp::PersonalReliefHelp' | abpLocalization }}</div>
        </div>
      </div>
    </div>
  </div>

  <div *abpPermission="'Erp.PayrollSetup.Update'" class="mt-3" style="max-width: 760px">
    <div class="text-end">
      <abp-button buttonType="submit" iconClass="fa fa-check" [loading]="saving()" [disabled]="form.pristine || loading()">
        {{ 'Erp::Save' | abpLocalization }}
      </abp-button>
    </div>
  </div>
</form>
