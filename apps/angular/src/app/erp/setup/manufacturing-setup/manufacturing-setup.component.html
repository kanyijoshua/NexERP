<erp-page-toolbar
  title="Erp::ManufacturingSetup"
  breadcrumb="Erp::Menu:Manufacturing"
  icon="fas fa-gears"
  [showSearch]="false"
  [showCreate]="false"
></erp-page-toolbar>

<form [formGroup]="form" (ngSubmit)="save()">
  <div class="card border-0 shadow-sm" style="max-width: 720px">
    <div class="card-body">
      <div class="row align-items-center mb-2">
        <label class="col-sm-5 col-form-label" for="mfg-nos">{{ 'Erp::ProductionOrderNos' | abpLocalization }}</label>
        <div class="col-sm-7">
          <select id="mfg-nos" class="form-select form-select-sm" formControlName="productionOrderNos">
            <option [ngValue]="null">{{ 'Erp::NumberedByHand' | abpLocalization }}</option>
            @for (s of series(); track s.id) {
              <option [ngValue]="s.code">{{ s.code }} — {{ s.description }}</option>
            }
          </select>
        </div>
      </div>
      <div class="row align-items-center mb-2">
        <label class="col-sm-5 col-form-label" for="mfg-wip">{{ 'Erp::WipAccount' | abpLocalization }}</label>
        <div class="col-sm-7">
          <erp-lookup inputId="mfg-wip" formControlName="wipAccountNo" entity="glAccount"></erp-lookup>
        </div>
      </div>
      <div class="row align-items-center mb-2">
        <label class="col-sm-5 col-form-label" for="mfg-cap">{{ 'Erp::CapacityAppliedAccount' | abpLocalization }}</label>
        <div class="col-sm-7">
          <erp-lookup inputId="mfg-cap" formControlName="capacityAppliedAccountNo" entity="glAccount"></erp-lookup>
        </div>
      </div>
      <div class="row align-items-center mb-2">
        <label class="col-sm-5 col-form-label" for="mfg-var">{{ 'Erp::VarianceAccount' | abpLocalization }}</label>
        <div class="col-sm-7">
          <erp-lookup inputId="mfg-var" formControlName="varianceAccountNo" entity="glAccount"></erp-lookup>
        </div>
      </div>
    </div>
  </div>

  <div *abpPermission="'Erp.ManufacturingSetup.Update'" class="mt-3" style="max-width: 720px">
    <div class="text-end">
      <abp-button buttonType="submit" iconClass="fa fa-check" [loading]="saving()" [disabled]="form.pristine || loading()">
        {{ 'Erp::Save' | abpLocalization }}
      </abp-button>
    </div>
  </div>
</form>
