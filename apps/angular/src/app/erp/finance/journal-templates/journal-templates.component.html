<app-company-switcher></app-company-switcher>

<erp-page-toolbar
  title="Erp::Menu:JournalTemplates"
  breadcrumb="Erp::Menu:Journals"
  icon="fas fa-layer-group"
  [(filter)]="filter"
  permission="Erp.Journals.Manage"
  (create)="openCreate()"
></erp-page-toolbar>

<div class="card border-0 shadow-sm">
  <div class="card-body p-0">
    <ngx-datatable [rows]="data.items" [count]="data.totalCount" [list]="list" default>
      <ngx-datatable-column [name]="'Erp::Code' | abpLocalization" prop="name" [width]="120"></ngx-datatable-column>
      <ngx-datatable-column
        [name]="'Erp::Description' | abpLocalization"
        prop="description"
        [width]="260"
      ></ngx-datatable-column>
      <ngx-datatable-column [name]="'Erp::TemplateType' | abpLocalization" [width]="150">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ typeOptions[row.type]?.label | abpLocalization }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column [name]="'Erp::Recurring' | abpLocalization" prop="recurring" [width]="110">
        <ng-template let-value="value" ngx-datatable-cell-template>
          <i class="fas" [ngClass]="value ? 'fa-check text-success' : 'fa-minus text-muted'"></i>
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column
        [name]="'Erp::SourceCode' | abpLocalization"
        prop="sourceCode"
        [width]="120"
      ></ngx-datatable-column>
      <ngx-datatable-column
        [name]="'Erp::BatchCount' | abpLocalization"
        prop="batchCount"
        [width]="100"
      ></ngx-datatable-column>
      <ngx-datatable-column [name]="'Erp::Actions' | abpLocalization" [sortable]="false" [width]="120">
        <ng-template let-row="row" ngx-datatable-cell-template>
          <button
            *abpPermission="'Erp.Journals.Manage'"
            type="button"
            class="btn btn-sm btn-outline-primary me-1"
            [title]="'Erp::Edit' | abpLocalization"
            (click)="openEdit(row)"
          >
            <i class="fas fa-pen"></i>
          </button>
          <button
            *abpPermission="'Erp.Journals.Manage'"
            type="button"
            class="btn btn-sm btn-outline-danger"
            [title]="'Erp::Delete' | abpLocalization"
            (click)="remove(row)"
          >
            <i class="fas fa-trash"></i>
          </button>
        </ng-template>
      </ngx-datatable-column>
    </ngx-datatable>
  </div>
</div>

<abp-modal [(visible)]="isModalOpen" [busy]="isBusy">
  <ng-template #abpHeader>
    <h5 class="modal-title">
      {{ (selected ? 'Erp::Edit' : 'Erp::NewTemplate') | abpLocalization }}
      <span *ngIf="selected" class="text-muted">· {{ selected.name }}</span>
    </h5>
  </ng-template>

  <ng-template #abpBody>
    <form *ngIf="form" [formGroup]="form" (ngSubmit)="save()" validateOnSubmit>
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label" for="jt-name">{{ 'Erp::Code' | abpLocalization }} *</label>
          <input id="jt-name" type="text" class="form-control text-uppercase" formControlName="name" autofocus />
        </div>
        <div class="col-md-8">
          <label class="form-label" for="jt-description">{{ 'Erp::Description' | abpLocalization }}</label>
          <input id="jt-description" type="text" class="form-control" formControlName="description" />
        </div>

        <div class="col-md-6">
          <label class="form-label" for="jt-type">{{ 'Erp::TemplateType' | abpLocalization }}</label>
          <select id="jt-type" class="form-select" formControlName="type">
            <option *ngFor="let option of typeOptions" [ngValue]="option.value">
              {{ option.label | abpLocalization }}
            </option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label" for="jt-source">{{ 'Erp::SourceCode' | abpLocalization }}</label>
          <input id="jt-source" type="text" class="form-control text-uppercase" formControlName="sourceCode" />
        </div>
        <div class="col-md-3">
          <label class="form-label" for="jt-series">{{ 'Erp::NoSeriesCode' | abpLocalization }}</label>
          <select id="jt-series" class="form-select" formControlName="noSeriesCode">
            <option value="">—</option>
            <option *ngFor="let code of seriesCodes" [value]="code">{{ code }}</option>
          </select>
        </div>

        <div class="col-12">
          <div class="form-check form-switch">
            <input id="jt-recurring" type="checkbox" class="form-check-input" formControlName="recurring" />
            <label class="form-check-label" for="jt-recurring">{{ 'Erp::Recurring' | abpLocalization }}</label>
          </div>
          <div class="form-text">{{ 'Erp::RecurringTemplateHelp' | abpLocalization }}</div>
        </div>
      </div>
    </form>
  </ng-template>

  <ng-template #abpFooter>
    <button type="button" class="btn btn-outline-secondary" abpClose>
      {{ 'AbpUi::Cancel' | abpLocalization }}
    </button>
    <abp-button iconClass="fa fa-check" [disabled]="form?.invalid" (click)="save()">
      {{ 'Erp::Save' | abpLocalization }}
    </abp-button>
  </ng-template>
</abp-modal>
