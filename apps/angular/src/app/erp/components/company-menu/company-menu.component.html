@if (current$ | async; as current) {
  <button
    type="button"
    class="company-menu__trigger"
    [class.company-menu__trigger--nav]="variant === 'nav'"
    [class.company-menu__trigger--title]="variant === 'title'"
    [matMenuTriggerFor]="menu"
    [attr.aria-label]="'Erp::SwitchCompany' | abpLocalization"
  >
    <i class="fas fa-building company-menu__icon" aria-hidden="true"></i>
    <span class="company-menu__name">{{ current.displayName }}</span>
    <i class="fas fa-chevron-down company-menu__caret" aria-hidden="true"></i>
  </button>

  <mat-menu #menu="matMenu" class="company-menu__panel">
    <div class="company-menu__label">{{ 'Erp::SwitchCompany' | abpLocalization }}</div>
    @for (company of companies$ | async; track company.id) {
      <button mat-menu-item type="button" (click)="switchTo(company)" [class.company-menu__item--active]="isActive(company)">
        <i class="fas company-menu__check" [class.fa-check]="isActive(company)" aria-hidden="true"></i>
        <span>{{ company.displayName }}</span>
        @if (company.evaluationCompany) {
          <span class="company-menu__tag">{{ 'Erp::Evaluation' | abpLocalization }}</span>
        }
      </button>
    }
    <ng-container *abpPermission="'Erp.Companies.Copy'">
      <mat-divider />
      <button mat-menu-item type="button" (click)="copy(current)">
        <i class="fas fa-copy company-menu__check" aria-hidden="true"></i>
        <span>{{ 'Erp::CopyCompany' | abpLocalization }}…</span>
      </button>
    </ng-container>
  </mat-menu>
}
