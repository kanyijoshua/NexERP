<div class="card border-0 shadow-sm mb-3 erp-record-part">
  <div class="card-header bg-light d-flex align-items-center gap-2 py-1">
    <span class="fw-bold text-secondary small text-uppercase me-auto">
      <i [class]="entity.icon + ' me-1'"></i>{{ (part.titleKey ?? entity.pluralKey) | abpLocalization }}
      <span class="badge bg-secondary ms-1">{{ count }}</span>
    </span>
    @if (loading) {
      <span class="spinner-border spinner-border-sm text-secondary" role="status"></span>
    }
    @if (canCreate) {
      <button type="button" class="btn btn-sm btn-link text-decoration-none" (click)="addLine()">
        <i class="fas fa-plus me-1"></i>{{ 'Erp::NewLine' | abpLocalization }}
      </button>
    }
  </div>

  <div class="card-body p-2">
    <erp-line-grid
      [lines]="rows"
      [columns]="gridColumns"
      [readonly]="!canCreate && !canUpdate"
      [allowAdd]="canCreate"
      [allowRemove]="canDelete"
      [openable]="true"
      [showAddButton]="false"
      (addLine)="addLine()"
      (removeLine)="removeLine($event)"
      (lineChange)="onLineChange($event)"
      (openLine)="openLine($event)"
    ></erp-line-grid>

    @if (totals.length && count) {
      <div class="d-flex flex-wrap justify-content-end gap-4 border-top mt-2 pt-2 small">
        @for (total of totals; track total.field) {
          <div>
            <span class="text-muted me-2">{{ 'Erp::Total' | abpLocalization }} {{ total.labelKey | abpLocalization }}</span>
            <span class="fw-bold font-monospace">{{ total.value | erpAmount }}</span>
          </div>
        }
      </div>
    }
  </div>
</div>
