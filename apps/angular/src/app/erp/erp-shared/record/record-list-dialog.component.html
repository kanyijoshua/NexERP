<div class="modal-header flex-wrap gap-2">
  <h5 class="modal-title me-auto">
    <i [class]="entity.icon + ' text-primary me-2'"></i>{{ (selectable ? 'Erp::SelectFrom' : 'Erp::AllRecordsOf') | abpLocalization: (entity.pluralKey | abpLocalization) }}
  </h5>
  @if (canCreate) {
    <button type="button" class="btn btn-sm btn-primary" (click)="createNew()">
      <i class="fas fa-plus me-1"></i>{{ 'Erp::New' | abpLocalization }}
    </button>
  }
  <button type="button" class="btn-close" [attr.aria-label]="'AbpUi::Close' | abpLocalization" (click)="modal.dismiss()"></button>
</div>

<div class="modal-body p-0">
  <erp-table
    class="erp-record-list"
    [tableId]="'record-dialog-' + entity.key"
    height="60vh"
    [wrapInCard]="false"
    [source]="source"
    [columns]="columns"
    [initialSearch]="initialFilter"
    [actionsWidth]="selectable ? 170 : 110"
    [selectable]="true"
    selectionType="single"
    [selected]="selection"
    (rowClick)="setSelected($event)"
    (rowDblClick)="onDoubleClick($event)"
    (codeClick)="selectable ? pick($event) : openCard($event)"
    (rowsChange)="onRowsChange($event.rows)"
    (keydown.enter)="onEnter($event)"
  >
    <ng-template erpTableActions let-row="row">
      <div class="d-inline-flex align-items-center gap-1">
        @if (selectable) {
          <button type="button" class="btn btn-sm btn-outline-primary me-1" (click)="pick(row); $event.stopPropagation()">
            {{ 'Erp::Select' | abpLocalization }}
          </button>
        }
        <button
          type="button"
          class="btn btn-sm btn-outline-secondary erp-action-btn"
          [title]="'Erp::OpenCard' | abpLocalization"
          [attr.aria-label]="'Erp::OpenCard' | abpLocalization"
          (click)="openCard(row, $event)"
        >
          <i class="fas fa-pen-to-square"></i>
        </button>
        @if (canDelete) {
          <button
            type="button"
            class="btn btn-sm btn-outline-danger erp-action-btn"
            [title]="'Erp::Delete' | abpLocalization"
            [attr.aria-label]="'Erp::Delete' | abpLocalization"
            (click)="remove(row, $event)"
          >
            <i class="fas fa-trash-alt"></i>
          </button>
        }
      </div>
    </ng-template>
  </erp-table>
</div>

<div class="modal-footer">
  <span class="me-auto small text-muted">{{ selectable ? ('Erp::ListDialogHint' | abpLocalization) : '' }}</span>
  <button type="button" class="btn btn-outline-secondary" (click)="modal.dismiss()">{{ 'AbpUi::Cancel' | abpLocalization }}</button>
  @if (selectable) {
    <button type="button" class="btn btn-primary" [disabled]="!selected" (click)="pick()">
      <i class="fas fa-check me-1"></i>{{ 'Erp::Select' | abpLocalization }}
    </button>
  }
</div>
