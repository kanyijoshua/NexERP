@if (reports.length || showPrint) {
  <div ngbDropdown class="d-inline-block" placement="bottom-end" container="body">
    <button type="button" class="btn btn-sm btn-outline-secondary" ngbDropdownToggle>
      <i class="fas fa-file-lines me-1"></i>{{ 'Erp::Report' | abpLocalization }}
    </button>
    <div ngbDropdownMenu class="dropdown-menu-end shadow-sm small">
      @if (showPrint) {
        <button ngbDropdownItem type="button" (click)="print()">
          <i class="fas fa-print fa-fw me-2 text-muted"></i>{{ 'Erp::PrintPage' | abpLocalization }}
        </button>
      }
      @if (showPrint && reports.length) {
        <div class="dropdown-divider"></div>
      }
      @for (report of reports; track report.code) {
        <a ngbDropdownItem [routerLink]="['/erp/reports/standard']" [queryParams]="query(report)">
          <i class="fas fa-file-invoice fa-fw me-2 text-muted"></i>{{ report.name }}
        </a>
      }
      @if (reports.length) {
        <div class="dropdown-divider"></div>
        <a ngbDropdownItem [routerLink]="['/erp/reports/standard']">
          <i class="fas fa-list fa-fw me-2 text-muted"></i>{{ 'Erp::AllReports' | abpLocalization }}
        </a>
      }
    </div>
  </div>
}
